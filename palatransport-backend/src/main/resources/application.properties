# ============================================================
#  application.properties — Configurazione principale di Spring Boot
# ============================================================
#
# Questo file è il file di configurazione centrale dell'applicazione.
# Spring Boot lo legge all'avvio e usa i valori qui definiti
# per configurare database, porta del server, sicurezza, ecc.
#

# --- SERVER ---
# Porta su cui il backend sarà raggiungibile (default è 8080)
server.port=8081

# --- DATABASE POSTGRESQL ---
# Connessione al database reale PostgreSQL installato in locale
spring.datasource.url=jdbc:postgresql://localhost:5432/palatransportdb
spring.datasource.username=postgres
spring.datasource.password=fruzzom1

# --- JPA / HIBERNATE ---
# Dialetto per PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ddl-auto=create-drop: ad ogni avvio Hibernate crea le tabelle dal codice
# delle Entity, e le cancella alla chiusura. Perfetto per lo sviluppo.
# In produzione si userebbe "validate" o "none" + Flyway per le migrazioni.
spring.jpa.hibernate.ddl-auto=create

# Stampa le query SQL eseguite nel log (utile per il debug e per capire cosa fa JPA)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# --- JWT ---
# Chiave segreta usata per firmare i token JWT (deve essere lunga almeno 32 caratteri)
# In produzione questa chiave andrebbe gestita come variabile d'ambiente, NON in chiaro qui
jwt.secret=palatransport-secret-key-for-jwt-signing-2024
# AccessToken: 15 minuti in millisecondi (15 * 60 * 1000)
jwt.expiration=900000
# RefreshToken: 7 giorni in millisecondi (7 * 24 * 60 * 60 * 1000)
jwt.refresh-expiration=604800000
